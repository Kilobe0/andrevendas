name: Deploy frontend no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  # Permite redisparar manualmente (ex.: depois de cadastrar obras novas)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependências
        working-directory: frontend
        run: npm ci

      # A máquina do Fly hiberna (auto stop/start) — este passo também serve de "wake up"
      - name: Confere se a API está no ar
        run: |
          for i in $(seq 1 10); do
            if curl -sf --max-time 15 "${{ vars.NEXT_PUBLIC_API_URL }}/artworks" > /dev/null; then
              echo "API ok"; exit 0
            fi
            echo "tentativa $i falhou, aguardando..."; sleep 15
          done
          echo "::error::API indisponível em ${{ vars.NEXT_PUBLIC_API_URL }} — faça o deploy do backend no Fly antes (flyctl deploy em backend/)."
          exit 1

      - name: Build estático
        working-directory: frontend
        env:
          STATIC_EXPORT: '1'
          BASE_PATH: /andrevendas
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
