name: Deploy frontend no Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-cloudflare.yml'
  # Permite redisparar manualmente (ex.: depois de cadastrar obras novas)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependências
        working-directory: frontend
        run: npm ci

      # A máquina do Fly hiberna (auto stop/start) — este passo também serve de "wake up"
      - name: Confere se a API está no ar
        run: |
          for i in $(seq 1 10); do
            if curl -sf --max-time 15 "${{ vars.NEXT_PUBLIC_API_URL }}/artworks" > /dev/null; then
              echo "API ok"; exit 0
            fi
            echo "tentativa $i falhou, aguardando..."; sleep 15
          done
          echo "::error::API indisponível em ${{ vars.NEXT_PUBLIC_API_URL }} — faça o deploy do backend no Fly antes (flyctl deploy em backend/)."
          exit 1

      # Sem BASE_PATH: na Cloudflare o site fica na raiz do domínio
      - name: Build estático
        working-directory: frontend
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Deploy no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/out --project-name=andrevalenca
