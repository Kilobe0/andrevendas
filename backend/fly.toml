app = 'andrevendas-api'
primary_region = 'gru' # São Paulo

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3001'
  FRONTEND_URL = 'https://kilobe0.github.io,https://andrevalenca.pages.dev'
  PUBLIC_API_URL = 'https://andrevendas-api.fly.dev'
  CHECKOUT_RETURN_URL = 'https://kilobe0.github.io/andrevendas/checkout/retorno'

[http_service]
  internal_port = 3001
  force_https = true
  # máquina para quando ociosa (custo ~zero) e religa em <1s no primeiro request
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
