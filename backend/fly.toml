app = 'andrevendas-api'
primary_region = 'gru' # São Paulo

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3001'
  FRONTEND_URL = 'https://andrevalenca.pages.dev'
  PUBLIC_API_URL = 'https://andrevendas-api.fly.dev'
  CHECKOUT_RETURN_URL = 'https://andrevalenca.pages.dev/checkout/retorno'

[http_service]
  internal_port = 3001
  force_https = true
  # máquina sempre ligada — sem cold start (shared-cpu-1x 256MB ≈ US$2/mês)
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
